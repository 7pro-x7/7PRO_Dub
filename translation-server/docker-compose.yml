services:
  translator:
    build:
      context: .
      args:
        LANGUAGES: ${LANGUAGES:-ar,en,fr,de,es,tr}
    env_file: .env
    restart: unless-stopped
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
