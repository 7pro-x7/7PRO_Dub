[versions]
agp = "8.13.2"
kotlin = "2.3.10"
ksp = "2.3.9"
coreKtx = "1.17.0"
lifecycleRuntime = "2.10.0"
activityCompose = "1.12.4"
composeBom = "2026.02.01"
navigationCompose = "2.9.7"
serialization = "1.10.0"
ktor = "3.4.1"
coil = "3.4.0"
koin = "4.1.1"
supabase = "3.7.0"
datastore = "1.1.7"
desugar = "2.1.5"
media3 = "1.10.1"
playServicesAds = "25.4.0"
work = "2.10.5"
# Bumped from 9.2.2 (Sep 2024): that release predates Android 14's stricter MediaProjection
# rules (a screen capture must call MediaProjection.registerCallback() before
# createVirtualDisplay(), enforced once the app's targetSdk — 36 here — is 34+, else the capture
# silently fails with nothing shown to either side) and several since-fixed Android screen-share
# issues Jitsi's own changelog lists. 11.6.3 is the latest published build; this is a 5-major-
# version jump, so re-test the whole call flow (join, mute toggles, screen share, PiP) after
# syncing — Jitsi's public API (JitsiMeetConferenceOptions.Builder, the broadcast action strings
# in ClassroomCallActivity) has stayed stable across these releases, but this hasn't been built
# against here.
jitsiMeetSdk = "11.6.3"
localbroadcastmanager = "1.1.0"
firebaseBom = "34.5.0"
googleServices = "4.4.3"
okhttp = "4.12.0"
filament = "1.74.0"
onnxruntime = "1.22.0"
mediapipe = "0.10.26.1"

