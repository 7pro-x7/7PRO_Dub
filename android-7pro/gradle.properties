# Heap budgets are sized for the 8 GB build sandbox, where the Gradle JVM,
# the Kotlin compile daemon, and the agent process all share memory. Without
# an explicit kotlin.daemon.jvmargs the Kotlin daemon inherits the Gradle
# daemon's -Xmx, putting a second multi-GB JVM on the box.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx1g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=false
org.gradle.caching=true
# Configuration cache works by serializing/instrumenting the build's plugin classpath — AGP's
# own classes included — between runs, and a stale or version-mismatched cache from that process
# is a known source of crashes inside AGP's own plugin bytecode (a failure to instrument
# PluginCrashReporter, of all things, is squarely in that territory) rather than anything in this
# project's own code. Turned off until it's confirmed to run cleanly across the exact Gradle/AGP/
# JDK combination this project builds with; re-enable once that's verified, since it does speed
# up repeat builds.
org.gradle.configuration-cache=false
org.gradle.parallel=true
