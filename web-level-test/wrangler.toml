# 7PRO — صفحة اختبار تحديد المستوى (من غير تسجيل دخول)
# النشر:  cd web-level-test && npx wrangler deploy
# الرابط بعد النشر:  https://7pro-level-test.<your-subdomain>.workers.dev/
name = "7pro-level-test"
