workflows:
  android-workflow:
    name: CrashLab Android Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      vars:
        PACKAGE_NAME: "com.crashlab.analyzer"
      java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Run unit tests
        script: |
          bash ./gradlew test --stacktrace

      - name: Build debug APK
        script: |
          bash ./gradlew assembleDebug --stacktrace

      - name: Build release APK (unsigned)
        script: |
          bash ./gradlew assembleRelease --stacktrace

      - name: Build App Bundle
        script: |
          bash ./gradlew bundleRelease --stacktrace

    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/bundle/**/*.aab
      - app/build/outputs/**/mapping.txt
      - app/build/reports/tests/**

    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
