# ============================================================================
#  ArabicDub — CodeMagic CI
# ============================================================================
#  كيف تفعّل:
#   1. ارفع هذا المستودع إلى GitHub/GitLab/Bitbucket.
#   2. في CodeMagic: New App → اختر المستودع → Build type: "Use custom
#      configuration" وسيكتشف codemagic.yaml تلقائيًا.
#   3. شغّل البناء — سيُنتج APK جيت-أوب في "Artifacts" مع كل بناء.
#
#  ملاحظات:
#   - AGP 8.5 يتطلب JDK 17 (مشغّل هنا عبر environment.java + خطوة احتياطية).
#   - بناء debug لا يحتاج أي أسرار توقيع.
#   - الأرتيفاكثان الكبيران (sherpa-onnx + ffmpeg-kit) ينزّلهما مشروع Gradle
#     نفسه عند أول بناء مع التحقق من بصمات SHA-256 — لا إعداد إضافي مطلوب.
# ============================================================================

workflows:
  android-debug:
    name: ArabicDub — Debug APK
    # mac_mini_m2: الوحيد المشمول بالدقائق المجانية (500 دقيقة/شهر) في الخطة
    # المجانية. أجهزة Linux/Windows لا تملك دقائق مجانية إطلاقًا وتحتاج تفعيل
    # فوترة — لهذا كانت تظهر رسالة "not available with current billing plan".
    # إن كان لديك خطة مدفوعة وتفضّل Linux: غيّرها إلى linux أو linux_x2.
    instance_type: mac_mini_m2
    max_build_duration: 90

    environment:
      java: 17

    cache:
      cache_paths:
        - $HOME/.gradle
        - $CM_BUILD_DIR/local-maven

    scripts:
      - name: عرض البيئة
        script: |
          set -x
          echo "CM_BUILD_DIR=$CM_BUILD_DIR"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: التأكد من JDK 17
        script: |
          set -e
          if ! java -version 2>&1 | head -1 | grep -q '"17'; then
            for d in /usr/lib/jvm/zulu-17* /usr/lib/jvm/*17* /usr/lib/jvm/openjdk-17* \
                     /Library/Java/JavaVirtualMachines/*17*/Contents/Home \
                     /Library/Java/JavaVirtualMachines/zulu-17*/Contents/Home; do
              if [ -x "$d/bin/java" ]; then
                export JAVA_HOME="$d"
                export PATH="$JAVA_HOME/bin:$PATH"
                break
              fi
            done
          fi
          java -version

      - name: إعداد مسار Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: بناء Debug APK
        # إعدادات ذاكرة محافِظة تعمل على أي نوع جهاز (Mac أو Linux) بأمان.
        script: |
          cd "$CM_BUILD_DIR"
          chmod +x gradlew
          ./gradlew --stacktrace --no-daemon assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.workers.max=1

    artifacts:
      - app/build/outputs/apk/**/*.apk
